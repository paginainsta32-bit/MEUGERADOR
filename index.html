<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador Profissional de Shorts</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f1016; color: #f5f5f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #1a1b26; width: 100%; max-width: 600px; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); border: 1px solid #2f334d; }
        h1 { font-size: 24px; margin-bottom: 20px; color: #7aa2f7; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; margin-bottom: 8px; color: #bb9af7; font-weight: 600; }
        select, textarea, input { width: 100%; padding: 12px; background-color: #24283b; border: 1px solid #414868; border-radius: 8px; color: #fff; font-size: 14px; }
        textarea { resize: vertical; height: 120px; }
        select:focus, textarea:focus, input:focus { outline: none; border-color: #7aa2f7; }
        button { background-color: #7aa2f7; color: #1a1b26; border: none; padding: 14px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #89b4fa; }
        .preview-section { margin-top: 25px; border-top: 1px solid #2f334d; padding-top: 20px; text-align: center; }
        .preview-section p { color: #565f89; font-size: 13px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎬 Gerador de Shorts Automático</h1>
        
        <form id="shortForm">
            <div class="form-group">
                <label for="githubToken">GitHub Personal Access Token (PAT)</label>
                <input type="password" id="githubToken" placeholder="Cole aqui o seu token do GitHub (ghp_...)">
            </div>

            <div class="form-group">
                <label for="categoria">Tipo da História (Tema)</label>
                <select id="categoria">
                    <option value="terror">👻 Terror & Sobrenatural</option>
                    <option value="medieval">🛡️ Medieval & Épico</option>
                    <option value="misterio">🔍 Mistérios & Curiosidades</option>
                    <option value="motivacional">⚡ Motivacional & Citações</option>
                </select>
            </div>

            <div class="form-group">
                <label for="estiloImagem">Estilo Visual das Imagens</label>
                <select id="estiloImagem">
                    <option value="dark">Cinematográfico Escuro / Gótico</option>
                    <option value="fantasy">Fantasia / Pintura Medieval</option>
                    <option value="realistic">Realista / Alta Definição</option>
                    <option value="anime">Estilo Animação / Ilustração</option>
                </select>
            </div>

            <div class="form-group">
                <label for="roteiro">Roteiro / Texto do Episódio</label>
                <textarea id="roteiro" placeholder="Escreva ou cole o roteiro da sua história aqui..."></textarea>
            </div>

            <button type="button" onclick="dispararGeracao()">Gerar Episódio na Nuvem</button>
        </form>

        <div class="preview-section">
            <p id="statusMsg">Preencha os campos e clique em gerar para disparar o robô.</p>
        </div>
    </div>

    <script>
        async function dispararGeracao() {
            const token = document.getElementById('githubToken').value.trim();
            const categoria = document.getElementById('categoria').value;
            const roteiro = document.getElementById('roteiro').value.trim();
            const statusMsg = document.getElementById('statusMsg');

            if(!token) {
                alert('Por favor, insira o seu GitHub Token para autenticar!');
                return;
            }

            if(!roteiro) {
                alert('Por favor, escreva um roteiro antes de gerar!');
                return;
            }

            statusMsg.innerText = "⏳ A enviar pedido para o GitHub Actions...";

            // Configuração do repositório
            const owner = "paginainsta32-bit";
            const repo = "MEUGERADOR";
            const workflowId = "gerar_video.yml";

            try {
                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/${workflowId}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        ref: 'main',
                        inputs: {
                            categoria: categoria,
                            roteiro_texto: roteiro
                        }
                    })
                });

                if (response.ok) {
                    statusMsg.innerText = "✅ Vídeo a ser gerado na nuvem! Verifique a aba Actions no GitHub em instantes.";
                } else {
                    const errData = await response.json();
                    statusMsg.innerText = "❌ Erro ao disparar: " + (errData.message || response.statusText);
                }
            } catch (error) {
                statusMsg.innerText = "❌ Erro de ligação: " + error.message;
            }
        }
    </script>
</body>
</html>
